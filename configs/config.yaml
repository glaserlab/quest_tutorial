defaults:
  - env: local  # Use 'env=quest' for SLURM cluster
  - model: convnet
  - dataset: mnist
  - _self_

training:
  epochs: 10
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  use_scheduler: true
  scheduler_step: 5
  scheduler_gamma: 0.1

# Paths (defined in env configs, but can be overridden)
paths:
  data_dir: ./data
  output_dir: ./outputs
